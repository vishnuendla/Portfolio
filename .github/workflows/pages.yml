name: Portfolio CI and deployment

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
      - name: Check required portfolio assets
        run: |
          test -f assets/css/portfolio.css
          test -f assets/img/favicon.svg
          test -f assets/resume/endla-vishnu-vardhan-resume.pdf
          grep -q 'id="work"' index.html
          grep -q 'id="about"' index.html
          grep -q 'id="contact"' index.html

      - name: Check local links and assets resolve
        run: |
          status=0
          for ref in $(grep -oE '(href|src)="[^"#]+"' index.html | sed -E 's/.*="([^"]+)"/\1/' | grep -vE '^(https?:|mailto:|tel:|//)'); do
            if [ ! -f "$ref" ]; then
              echo "::error file=index.html::Missing local file: $ref"
              status=1
            fi
          done
          for anchor in $(grep -oE 'href="#[^"]+"' index.html | sed -E 's/.*="#([^"]+)"/\1/'); do
            if ! grep -q "id=\"$anchor\"" index.html; then
              echo "::error file=index.html::Missing anchor target: #$anchor"
              status=1
            fi
          done
          exit $status

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
